<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روما - أرقَى أدوات التجميل والعناية</title>
    <style>
        :root {
            --primary-color: #ff2a75;
            --secondary-color: #ff75a0;
            --bg-color: #f9f9f9;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-area h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin: 0;
        }
        .logo-area p {
            font-size: 0.8rem;
            color: #777;
            margin: 0;
        }
        .admin-btn {
            background: #222;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .hero {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin: 20px;
            border-radius: 20px;
        }
        .hero h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1rem;
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero-btn {
            background: white;
            color: var(--primary-color);
            padding: 10px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* لوحة التحكم المخفية/الظاهرة للتعديل */
        .admin-panel {
            background: white;
            padding: 20px;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .admin-panel button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div>
                <h1 id="store-title">روما</h1>
                <p id="store-subtitle">أرقَى أدوات التجميل والعناية</p>
            </div>
        </div>
        <div>
            <a href="#" class="admin-btn" onclick="toggleAdminPanel(event)">لوحة التحكم</a>
        </div>
    </header>

    <!-- الواجهة الرئيسية -->
    <div class="hero" id="hero-section">
        <span style="background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px; font-size: 0.85rem;">عرض خاص لفترة محدودة</span>
        <h2 id="hero-title">تألقي كل يوم بأجمل إطلالة</h2>
        <p id="hero-desc">اكتشفي تشكيلة مميزة من أحدث مستحضرات التجميل والعناية بالبشرة بأفضل الأسعار. اطلبي الآن وسيوصلم طلبك حتى باب البيت!</p>
        <a href="#" class="hero-btn">تصفح المنتجات</a>
    </div>

    <!-- لوحة تحكم المصمم لتعديل النصوص -->
    <div class="container">
        <div class="admin-panel" id="adminControlPanel">
            <h3>لوحة تحكم الواجهة والنصوص</h3>
            <label>عنوان المتجر:</label>
            <input type="text" id="inputTitle" value="روما">
            
            <label>العنوان الرئيسي البارز:</label>
            <input type="text" id="inputHeroTitle" value="تألقي كل يوم بأجمل إطلالة">
            
            <label>الوصف الترويجي:</label>
            <textarea id="inputHeroDesc">اكتشفي تشكيلة مميزة من أحدث مستحضرات التجميل والعناية بالبشرة بأفضل الأسعار. اطلبي الآن وسيوصلم طلبك حتى باب البيت!</textarea>
            
            <button onclick="saveChanges()">حفظ التعديلات</button>
        </div>
    </div>

    <script>
        // تحميل البيانات المحفوظة مسبقاً إن وجدت
        window.onload = function() {
            if(localStorage.getItem('storeTitle')) document.getElementById('store-title').innerText = localStorage.getItem('storeTitle');
            if(localStorage.getItem('heroTitle')) document.getElementById('hero-title').innerText = localStorage.getItem('heroTitle');
            if(localStorage.getItem('heroDesc')) document.getElementById('hero-desc').innerText = localStorage.getItem('heroDesc');
        }

        function toggleAdminPanel(e) {
            e.preventDefault();
            const panel = document.getElementById('adminControlPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function saveChanges() {
            const newTitle = document.getElementById('inputTitle').value;
            const newHeroTitle = document.getElementById('inputHeroTitle').value;
            const newHeroDesc = document.getElementById('inputHeroDesc').value;

            localStorage.setItem('storeTitle', newTitle);
            localStorage.setItem('heroTitle', newHeroTitle);
            localStorage.setItem('heroDesc', newHeroDesc);

            alert('تم حفظ التعديلات بنجاح!');
            location.reload();
        }
    </script>
</body>
</html>
